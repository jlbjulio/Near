[package]
name = "near"
version = "1.0.10"
edition = "2024"
rust-version = "1.85"
description = "A quiet AirPods companion for Windows."
license = "MIT"
build = "build.rs"

[[bin]]
name = "Near"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-future = "0.3.2"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
 "Foundation", "Foundation_Collections", "Devices_Bluetooth", "Devices_Bluetooth_Advertisement",
 "Devices_Bluetooth_GenericAttributeProfile", "Devices_Bluetooth_Rfcomm", "Devices_Enumeration",
 "Devices_Radios", "Media_Control", "Networking_Sockets", "Storage_Streams",
 "Win32_Foundation", "Win32_Devices_Bluetooth", "Win32_Devices_DeviceAndDriverInstallation",
 "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_Media_Audio",
 "Win32_Media_KernelStreaming", "Win32_Security", "Win32_Storage_FileSystem",
 "Win32_Devices_Properties", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader",
 "Win32_Storage_Xps", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Variant",
 "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
